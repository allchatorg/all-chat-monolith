services:
  redis:
    image: redis:7.2
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: local_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:17
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_DB: chat_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64   # <--- Force x86 emulation
    ports:
      - "3310:3310"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 3310 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - clamav_data:/var/lib/clamav

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: smtp4dev
    restart: always
    ports:
      - "5000:80"  # Web UI
      - "25:25"    # SMTP
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - smtp4dev_data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

volumes:
  postgres_data:
  clamav_data:
  smtp4dev_data:
  rabbitmq_data:
