<!DOCTYPE html>
<!--/*
    Shared shell for every outgoing email: logo header, content slot and footer.
    Usage: <html th:replace="~{mail/layout :: layout('Subject - allchat', ~{::content})}">
    The logo is attached inline by the sender under the content id "allchat-light-logo".
    Styles are inline because many email clients drop <style> blocks; the media query
    below is only a progressive enhancement for narrow screens.
*/-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">allchat</title>
    <style>
        @media (max-width: 600px) {
            .email-container { border-radius: 0 !important; }
            .email-header, .email-content, .email-footer { padding: 30px 20px !important; }
            .email-code { font-size: 28px !important; letter-spacing: 4px !important; }
        }
    </style>
</head>
<body style="margin:0;padding:20px;background:#f5f7fa;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:16px;line-height:1.6;color:#333;">
<table role="presentation" class="email-container" cellpadding="0" cellspacing="0"
       style="width:100%;max-width:600px;margin:0 auto;background:#ffffff;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.1);overflow:hidden;border-spacing:0;">
    <tr>
        <td class="email-header" style="padding:40px 30px;background:#667eea;color:#ffffff;text-align:center;">
            <img src="cid:allchat-light-logo" alt="allchat" width="240" height="69"
                 style="display:block;width:240px;max-width:100%;height:auto;margin:0 auto 10px;border:0;">
            <p style="margin:0;font-size:17.6px;font-weight:300;color:#ffffff;line-height:1.6;">Connect • Chat • Share</p>
        </td>
    </tr>
    <tr>
        <td class="email-content" style="padding:40px 30px;">
            <div th:replace="${content}">Email content</div>
        </td>
    </tr>
    <tr>
        <td class="email-footer" style="padding:30px;background:#f0f3f7;border-top:1px solid #ddd;text-align:center;">
            <p style="margin:0;color:#555;font-size:17.6px;line-height:1.8;">Best regards,<br>The <span style="color:#667eea;font-weight:bold;">allchat</span> Team</p>
            <p style="margin:20px 0 0;color:#555;font-size:15.2px;line-height:1.6;">If you have any questions, contact <a href="mailto:support@allchat.org" style="color:#667eea;">support@allchat.org</a>.</p>
            <p style="margin:20px 0 0;font-size:12.8px;line-height:1.6;color:#888;">©<span th:text="${#dates.year(#dates.createNow())}">2026</span> allchat LLC. All rights reserved. 18+ only. allchat<sup style="font-size:0.6em;">®</sup> is a registered trademark of allchat LLC.</p>
        </td>
    </tr>
</table>
</body>
</html>
