<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: layout('New moderator application - allchat', ~{::content})}">
<body>
<div th:fragment="content">
    <h1 style="margin:0 0 20px;font-size:24px;font-weight:600;line-height:1.4;color:#222;">New moderator application</h1>
    <p style="margin:0 0 20px;font-size:17.6px;line-height:1.8;color:#444;">A user has submitted an application to become a moderator for allchat.</p>

    <div style="padding:20px;border-radius:10px;margin:20px 0;background:#f8f9fa;">
        <h2 style="margin:0 0 10px;font-size:19.2px;line-height:1.6;font-weight:600;color:#667eea;">Registered account</h2>
        <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: detail('App username', ${username})}"></p>
        <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: detail('App email', ${email})}"></p>
        <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: detail('Submitted at', ${applicationDate})}"></p>
    </div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 1: Basic information')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Username on platform', ${formUsername})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Email address', ${formEmail})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Time zone', ${timeZone})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Country of residence', ${country})}"></div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 2: Availability &amp; commitment')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Hours per week available', ${hoursPerWeek})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Days available', ${daysAvailable})}"></div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 3: Experience')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Has moderated before?', ${hasModeratedBefore})}"></div>
    <th:block th:if="${previousPlatforms != null and !previousPlatforms.isEmpty()}"><div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Previous platforms', ${previousPlatforms})}"></div></th:block>
    <th:block th:if="${whyInterested != null and !whyInterested.isEmpty()}"><div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Why interested?', ${whyInterested})}"></div></th:block>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 4: Judgment &amp; philosophy')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Role of a moderator', ${moderatorRoleDefinition})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Balancing freedom vs rules', ${freedomBalance})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Over-moderation vs under-moderation', ${moreDangerous})}"></div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 5: Handling difficult content')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Comfortable with disturbing content?', ${comfortableWithDisturbingContent})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Handling unsure classifications', ${unsureClassificationHandling})}"></div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 6: Legal &amp; safety awareness')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Read TOS &amp; guidelines', ${readTosAndGuidelines})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Understands the no-download rule', ${understandNoDownload})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Willing to follow procedures', ${willingToFollowProcedures})}"></div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 7: Confidentiality &amp; conduct')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Agrees to keep things confidential', ${agreeToKeepConfidential})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Agrees not to use powers for personal reasons', ${agreeNotToUseForPersonal})}"></div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 8: Escalation &amp; authority')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Enforcing rules against own views', ${comfortableEnforcingAgainstAgree})}"></div>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Handling an admin overrule', ${howToRespondToAdminOverrule})}"></div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 9: Admin track')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Interested in the admin track', ${interestedInAdmin})}"></div>
    <th:block th:if="${whyInterestedInAdmin != null and !whyInterestedInAdmin.isEmpty()}"><div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Why interested in admin', ${whyInterestedInAdmin})}"></div></th:block>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 10: Colored username')}"></h2>
    <div th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: qa('Agrees to a colored username', ${agreeToColoredName})}"></div>

    <h2 th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: section('Section 11: Final acknowledgment')}"></h2>
    <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: ack('Volunteer role', ${confirmVolunteer})}"></p>
    <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: ack('Decisions are reviewed', ${confirmReview})}"></p>
    <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: ack('Removal can happen', ${confirmRemoval})}"></p>
    <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: ack('Unpaid position', ${confirmUnpaid})}"></p>

    <div style="padding:20px;border-radius:10px;margin:30px 0 0;background:#f8f9fa;">
        <h2 style="margin:0 0 10px;font-size:19.2px;line-height:1.6;font-weight:600;color:#667eea;">Signature</h2>
        <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: detail('Digital signature', ${signature})}"></p>
        <p th:replace="~{MODERATOR_APPLICATION_TEMPLATE :: detail('Form date', ${formDate})}"></p>
    </div>
</div>

<!--/* Row fragments used above; never rendered on their own because the layout replaces <html>. */-->
<h2 th:fragment="section(label)" th:text="${label}"
    style="margin:30px 0 15px;padding-bottom:8px;border-bottom:2px solid #667eea;font-size:19.2px;font-weight:600;line-height:1.4;color:#667eea;">Section</h2>

<div th:fragment="qa(label, answer)" style="margin:0 0 15px;">
    <p th:text="${label}" style="margin:0 0 6px;font-size:15.2px;font-weight:600;line-height:1.5;color:#555;">Question</p>
    <p th:text="${answer}" style="margin:0;padding:15px;border-radius:8px;background:#f8f9fa;font-size:15.2px;line-height:1.6;color:#333;white-space:pre-wrap;overflow-wrap:anywhere;">Answer</p>
</div>

<p th:fragment="ack(label, agreed)" style="margin:0 0 10px;font-size:15.2px;line-height:1.6;color:#555;">
    <span th:text="${label}" style="font-weight:600;">Acknowledgment</span>
    <span th:if="${agreed}" style="display:inline-block;margin-left:8px;padding:2px 10px;border-radius:4px;background:#22a06b;color:#ffffff;font-weight:bold;">Agreed</span>
    <span th:unless="${agreed}" style="display:inline-block;margin-left:8px;padding:2px 10px;border-radius:4px;background:#c9372c;color:#ffffff;font-weight:bold;">Not agreed</span>
</p>

<p th:fragment="detail(label, value)" style="margin:5px 0;color:#555;line-height:1.6;">
    <strong th:text="${label} + ':'">Label:</strong> <span th:text="${value}">Value</span>
</p>
</body>
</html>
