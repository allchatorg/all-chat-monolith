<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content">
    <p style="margin:0 0 20px;font-size:22.4px;line-height:1.6;color:#222;">Hello,</p>
    <h1 style="margin:0 0 20px;font-size:24px;font-weight:600;line-height:1.4;color:#222;" th:text="${title}">Your purchase update</h1>
    <div style="padding:20px;border-radius:10px;margin:20px 0;background:#f8f9fa;">
        <h2 style="margin:0 0 10px;font-size:19.2px;line-height:1.6;font-weight:600;color:#667eea;">Purchase details</h2>
        <p style="margin:5px 0;color:#555;line-height:1.6;" th:text="${purchaseReference}">Purchase reference</p>
    </div>
    <p th:each="paragraph : ${paragraphs}" th:text="${paragraph}"
       style="margin:0 0 20px;font-size:17.6px;line-height:1.8;color:#444;white-space:pre-line;overflow-wrap:anywhere;">Your purchase status has changed.</p>
    <p style="margin:30px 0;text-align:center;">
        <a th:href="${detailsUrl}"
           style="display:inline-block;padding:14px 28px;border-radius:10px;background:#667eea;color:#ffffff;text-decoration:none;font-size:17.6px;font-weight:600;line-height:1.6;">View purchase</a>
    </p>
    <div style="height:3px;background:#667eea;margin:20px 0;border-radius:2px;"></div>
    <div style="background:#f0f3f7;padding:20px;border-radius:10px;margin:30px 0 0;">
        <p style="margin:0;font-size:15.2px;line-height:1.6;color:#555;">Sign in to the account used for this purchase to view its details.</p>
    </div>
</div>
</body>
</html>
