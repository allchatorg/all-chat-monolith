spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  quartz:
    jdbc:
      initialize-schema: always

logging:
  level:
    root: INFO
    com.mk3.chatapp: INFO
    com.example.adsportalbe: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
