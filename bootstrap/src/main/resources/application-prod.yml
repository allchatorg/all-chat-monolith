spring:
  jpa:
    hibernate:
      # WARNING: create-drop wipes the database on every restart/redeploy —
      # switch back to update once the schema reset is done
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.mk3.chatapp: INFO
    com.example.adsportalbe: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
