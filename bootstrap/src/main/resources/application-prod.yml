spring:
  jpa:
    hibernate:
      # No Flyway yet — update keeps existing data across restarts/redeploys
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.mk3.chatapp: INFO
    com.example.adsportalbe: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
