spring:
  jpa:
    hibernate:
      # Apply docs/sql/allchat-pro.sql before deploying. Never recreate billing data.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  quartz:
    jdbc:
      initialize-schema: never

logging:
  level:
    root: INFO
    com.mk3.chatapp: INFO
    com.example.adsportalbe: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
